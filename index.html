<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numerology Chart</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.5;
    color: #222;
    background: #fff;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px;
  }

  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }

  .intro {
    margin: 0 0 24px;
  }

  table {
    border-collapse: collapse;
    margin-bottom: 28px;
  }

  th,
  td {
    border: 1px solid #999;
    padding: 6px 8px;
    text-align: center;
    min-width: 20px;
  }

  th {
    background: #e6eef0;
    font-size: 20px;
  }

  tbody tr:hover {
    background: #fffbd1;
  }

  caption {
    font-size: 16px;
    color: #555;
    text-align: left;
    padding-bottom: 6px;
  }

  label {
    display: block;
    font-size: 22px;
    margin-bottom: 8px;
  }

  input {
    font-family: inherit;
    font-size: 24px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #999;
    border-radius: 4px;
  }

  input:focus {
    outline: 2px solid #0a558c;
  }

  button {
    font-family: inherit;
    font-size: 20px;
    padding: 10px 20px;
    margin: 12px 8px 0 0;
    color: #fff;
    background: #0a558c;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #08426e;
  }

  .quiet {
    color: #222;
    background: #f1f1f1;
    border: 1px solid #999;
  }

  .quiet:hover {
    background: #e0e0e0;
  }

  .result {
    margin-top: 28px;
  }

  .result p {
    margin: 0 0 8px;
    font-size: 24px;
  }

  .result-label {
    color: #555;
    font-size: 16px;
    display: block;
  }

  #resultTotal {
    font-size: 34px;
  }

  /* Input on the left, history on the right. Stacked by default so phones
     get one column, side by side once there is room. */
  .columns {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .column {
    min-width: 0;
  }

  #historyTable {
    width: 100%;
  }

  #historyTable td {
    text-align: left;
    word-break: break-word;
  }

  #historyEmpty {
    color: #555;
  }

  @media (min-width: 640px) {
    .columns {
      flex-direction: row;
    }

    .column {
      flex: 1;
    }

    th,
    td {
      padding: 6px 10px;
    }
  }
</style>
</head>
<body>

<h1>Numerology Chart</h1>
<p class="intro">Type a name and see its Chaldean numerology total. Each letter
is worth the number at the top of its column.</p>

<table>
  <thead>
    <tr>
      <th scope="col">1</th>
      <th scope="col">2</th>
      <th scope="col">3</th>
      <th scope="col">4</th>
      <th scope="col">5</th>
      <th scope="col">6</th>
      <th scope="col">7</th>
      <th scope="col">8</th>
    </tr>
  </thead>
  <tbody>
    <tr><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>U</td><td>O</td><td>F</td></tr>
    <tr><td>I</td><td>K</td><td>G</td><td>M</td><td>H</td><td>V</td><td>Z</td><td>P</td></tr>
    <tr><td>J</td><td>R</td><td>L</td><td>T</td><td>N</td><td>W</td><td></td><td></td></tr>
    <tr><td>Q</td><td></td><td>S</td><td></td><td>X</td><td></td><td></td><td></td></tr>
    <tr><td>Y</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
  </tbody>
</table>

<div class="columns">
  <div class="column">
    <label for="nameInput">Enter a name</label>
    <input type="text" id="nameInput" autocomplete="off">
    <button type="button" id="calculateButton">Calculate</button>
    <button type="button" id="clearButton" class="quiet">Clear</button>

    <div class="result" id="result" role="status" aria-live="polite" hidden>
      <p><span class="result-label">Name</span><span id="resultName"></span></p>
      <p><span class="result-label">Total</span><span id="resultTotal"></span></p>
    </div>
  </div>

  <div class="column">
    <table id="historyTable" hidden>
      <caption>Names you have checked</caption>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Total</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
    <p id="historyEmpty">No names yet.</p>
  </div>
</div>

<script>
  // Chaldean letter values. There is no 9 in this system.
  var letterGroups = {
    1: 'AIJQY',
    2: 'BKR',
    3: 'CGLS',
    4: 'DMT',
    5: 'EHNX',
    6: 'UVW',
    7: 'OZ',
    8: 'FP'
  };

  // Flatten the groups into one letter -> number lookup, e.g. R -> 2.
  var letterValues = {};
  Object.keys(letterGroups).forEach(function (value) {
    letterGroups[value].split('').forEach(function (letter) {
      letterValues[letter] = Number(value);
    });
  });

  // Add up the letters. Anything that is not A-Z counts as 0.
  function nameTotal(name) {
    return name.toUpperCase().split('').reduce(function (total, character) {
      return total + (letterValues[character] || 0);
    }, 0);
  }

  var nameInput = document.getElementById('nameInput');
  var result = document.getElementById('result');
  var resultName = document.getElementById('resultName');
  var resultTotal = document.getElementById('resultTotal');
  var historyTable = document.getElementById('historyTable');
  var historyBody = document.getElementById('historyBody');
  var historyEmpty = document.getElementById('historyEmpty');

  // The history is only these rows, so a refresh loses it. Nothing is saved.
  function addHistoryRow(name, total) {
    var row = document.createElement('tr');
    var nameCell = document.createElement('td');
    var totalCell = document.createElement('td');
    nameCell.textContent = name;
    totalCell.textContent = total;
    row.appendChild(nameCell);
    row.appendChild(totalCell);
    historyBody.appendChild(row);
    historyEmpty.hidden = true;
    historyTable.hidden = false;
  }

  function showTotal() {
    var name = nameInput.value;
    if (name.trim() === '') {
      return;
    }
    var total = nameTotal(name);
    result.hidden = false;
    resultName.textContent = name;
    resultTotal.textContent = total;
    addHistoryRow(name, total);
  }

  function clearAll() {
    nameInput.value = '';
    resultName.textContent = '';
    resultTotal.textContent = '';
    result.hidden = true;
    historyBody.textContent = '';
    historyTable.hidden = true;
    historyEmpty.hidden = false;
    nameInput.focus();
  }

  document.getElementById('calculateButton').addEventListener('click', showTotal);
  document.getElementById('clearButton').addEventListener('click', clearAll);

  nameInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      showTotal();
    }
  });
</script>

</body>
</html>
