<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numerology Chart</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.5;
    color: #222;
    background: #fff;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px;
  }

  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }

  .intro {
    margin: 0 0 24px;
  }

  table {
    border-collapse: collapse;
    margin-bottom: 28px;
  }

  th,
  td {
    border: 1px solid #999;
    padding: 6px 10px;
    text-align: center;
    min-width: 24px;
  }

  th {
    background: #e6eef0;
    font-size: 20px;
  }

  tbody tr:hover {
    background: #fffbd1;
  }

  label {
    display: block;
    font-size: 22px;
    margin-bottom: 8px;
  }

  input {
    font-family: inherit;
    font-size: 24px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #999;
    border-radius: 4px;
  }

  input:focus {
    outline: 2px solid #0a558c;
  }

  button {
    font-family: inherit;
    font-size: 20px;
    padding: 10px 20px;
    margin-top: 12px;
    color: #fff;
    background: #0a558c;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #08426e;
  }

  .result {
    margin-top: 28px;
  }

  .result p {
    margin: 0 0 8px;
    font-size: 24px;
  }

  .result-label {
    color: #555;
    font-size: 16px;
    display: block;
  }

  #resultTotal {
    font-size: 34px;
  }
</style>
</head>
<body>

<h1>Numerology Chart</h1>
<p class="intro">Type a name and see its Chaldean numerology total. Each letter
is worth the number at the top of its column.</p>

<table>
  <thead>
    <tr>
      <th scope="col">1</th>
      <th scope="col">2</th>
      <th scope="col">3</th>
      <th scope="col">4</th>
      <th scope="col">5</th>
      <th scope="col">6</th>
      <th scope="col">7</th>
      <th scope="col">8</th>
    </tr>
  </thead>
  <tbody>
    <tr><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>U</td><td>O</td><td>F</td></tr>
    <tr><td>I</td><td>K</td><td>G</td><td>M</td><td>H</td><td>V</td><td>Z</td><td>P</td></tr>
    <tr><td>J</td><td>R</td><td>L</td><td>T</td><td>N</td><td>W</td><td></td><td></td></tr>
    <tr><td>Q</td><td></td><td>S</td><td></td><td>X</td><td></td><td></td><td></td></tr>
    <tr><td>Y</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
  </tbody>
</table>

<label for="nameInput">Enter a name</label>
<input type="text" id="nameInput" autocomplete="off">
<button type="button" id="calculateButton">Calculate</button>

<div class="result" role="status" aria-live="polite">
  <p><span class="result-label">Name</span><span id="resultName"></span></p>
  <p><span class="result-label">Total</span><span id="resultTotal"></span></p>
</div>

<script>
  // Chaldean letter values. There is no 9 in this system.
  var letterGroups = {
    1: 'AIJQY',
    2: 'BKR',
    3: 'CGLS',
    4: 'DMT',
    5: 'EHNX',
    6: 'UVW',
    7: 'OZ',
    8: 'FP'
  };

  // Flatten the groups into one letter -> number lookup, e.g. R -> 2.
  var letterValues = {};
  Object.keys(letterGroups).forEach(function (value) {
    letterGroups[value].split('').forEach(function (letter) {
      letterValues[letter] = Number(value);
    });
  });

  // Add up the letters. Anything that is not A-Z counts as 0.
  function nameTotal(name) {
    return name.toUpperCase().split('').reduce(function (total, character) {
      return total + (letterValues[character] || 0);
    }, 0);
  }

  var nameInput = document.getElementById('nameInput');
  var resultName = document.getElementById('resultName');
  var resultTotal = document.getElementById('resultTotal');

  function showTotal() {
    resultName.textContent = nameInput.value;
    resultTotal.textContent = nameTotal(nameInput.value);
  }

  document.getElementById('calculateButton').addEventListener('click', showTotal);

  nameInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      showTotal();
    }
  });
</script>

</body>
</html>
